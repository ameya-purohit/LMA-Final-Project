# Single configuration file shared by every system (CLAUDE.md §2.3).
# Systems differ only in control logic; everything here is common unless a
# section is explicitly per-system (agent.ablation, baselines.*).
# Model IDs live here and nowhere else (§2.4).

paths:
  cache_dir: .cache
  llm_cache: .cache/llm.sqlite
  github_cache: .cache/github
  trees_dir: .cache/trees
  index_dir: .cache/indexes
  repos_dir: data/repos
  results_dir: results
  traces_dir: results/traces

llm:
  temperature: 0.0
  max_output_tokens: 4096
  main:
    provider: gemini
    model: gemini-3.1-flash-lite
    # Leave unset (null) to use the provider default; see §2.4.
    thinking_level: null
    # Measured from Google's own 429s on 2026-10-30 (docs/quota.md): 15 per minute, 500 per day, 250,000 input tokens per minute.
    rpm: 15
    rpd: 500
    # D-50: several team members' keys for the same model, each with its own daily counter and limit (rpd applies
    # per key). Only keys present in .env are used; a missing one is skipped. Values are never logged.
    key_envs: [GEMINI_API_KEY, GEMINI_API_KEY_2, GEMINI_API_KEY_3, GEMINI_API_KEY_4]
  judge:
    # Final judge chosen at P8 (D-37) and kept by Ameya without a Mistral key (D-42): Groq gpt-oss-120b, throttled.
    # One judge per experiment: the test-set size at G2 is chosen so that its daily token limit is enough.
    provider: groq
    model: openai/gpt-oss-120b
    # D-50 assumed Groq's paid Developer plan; on 2026-11-07 the key still answered on the free `on_demand` tier
    # (200,000 tokens a day, about 60 judgements). D-53: several members' Groq keys for the same model, rotated like
    # the main model's keys; each is used only when present. Real limits are logged in docs/quota.md.
    key_envs: [GROQ_API_KEY, GROQ_API_KEY_2, GROQ_API_KEY_3, GROQ_API_KEY_4]
    rpm: 30
    rpd: 5000
  retry:
    max_attempts: 6
    base_delay_s: 2.0
    max_delay_s: 90.0
  quota_log: docs/quota.md

sandbox:
  image: rtci-sandbox:py310
  python: "3.10"
  cpus: 1
  memory: 1g
  pids_limit: 256
  probe_timeout_s: 10
  job_timeout_s: 120
  repo_test_timeout_s: 120

mutation:
  operators: [constant, negate_condition, swap_comparison, delete_statement, return_none]
  max_mutants_per_line: 12
  max_group_pairs: 6
  breakage_types: [SyntaxError, IndentationError, ImportError, ModuleNotFoundError, NameError, UnboundLocalError]
  local_breakage_types: [TypeError, AttributeError]

data:
  libraries:
    click: {owner: pallets, repo: click, package: click, tests_dir: tests}
    marshmallow: {owner: marshmallow-code, repo: marshmallow, package: marshmallow, tests_dir: tests}
    attrs: {owner: python-attrs, repo: attrs, package: attr, tests_dir: tests}
    python-dateutil: {owner: dateutil, repo: dateutil, package: dateutil, tests_dir: tests}
  active_libraries: [click, marshmallow]
  merged_since: "2020-01-01"
  max_source_files: 10
  min_validated_pairs: 120
  split_seed: 82
  dev_size: 20

retrieval:
  code_top_k: 5
  doc_top_k: 3
  # Exploratory extension only (E2+ and the retrieval study); the locked systems use BM25 alone.
  hybrid:
    dense_model: BAAI/bge-small-en-v1.5        # small, general text model: the laptop has ~1 GB of free memory
    rerank_model: Xenova/ms-marco-MiniLM-L-6-v2
    rrf_k: 60                                  # Cormack et al. (2009), not tuned
    fuse_depth: 50
    rerank_depth: 30
    max_chars: 800
    batch_size: 8

tools:
  open_file_max_lines: 200
  search_default_k: 5
  git_log_default_n: 10

agent:
  max_investigation_steps: 8
  max_probe_runs: 12
  max_probe_repairs: 2
  max_requests_per_question: 25
  max_mutation_checks: 12
  max_tools_per_turn: 3
  ablation:
    no_execution: false        # A1
    no_mutation: false         # A2
    flag_only: false           # A3
    whole_answer_probe: false  # A4
    selective: false           # A5
    retrieval: standard        # A10: standard | none | oracle
    llm_conflicts: false       # A7
    no_repair: false           # A8
    constants_only: false      # A11

baselines:
  b2_extra_steps: 0  # B2+ sets this from the pilot's median tokens per question

eval:
  bootstrap_resamples: 10000
  bootstrap_seed: 82
  ci_level: 0.95
  kappa_threshold: 0.6

# Exploratory multi-agent extension (E1-E6, PREREGISTRATION.md "Exploratory extension"). Not used by the locked study.
multiagent:
  max_requests: 12
  investigator_steps: 3
  analyst_steps: 2
  max_probe_runs: 12
  max_probe_repairs: 2
  single_budget: 8          # single-line mutation checks per question
  pair_budget: 3            # pairwise checks per question (E4+)
  max_mutants: 12
  max_candidates: 16
  flags:
    hybrid: false           # E2+
    graph: false            # E3+
    pairs: false            # E4+
    active: false           # E5+
    mcp: false              # E6
